name: Build e Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão da release (ex.: v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Executar testes
        run: dotnet test GeradorScriptsOltZte.sln --configuration Release

      - name: Publicar executável autossuficiente
        run: >
          dotnet publish src/GeradorOlt.Apresentacao/GeradorOlt.Apresentacao.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publicacao

      - name: Definir versão
        id: versao
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.versao }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: "Gerador de Scripts OLT ZTE ${{ steps.versao.outputs.tag }}"
          body: |
            ## Gerador de Scripts OLT ZTE — ${{ steps.versao.outputs.tag }}

            ### Download
            Baixe **GeradorOlt-ZTE.exe** e execute diretamente no Windows.

            ### Destaques
            - Interface nativa em WPF
            - Arquitetura MVVM
            - Preview e validação em tempo real
            - Compatibilidade com perfis JSON da versão Python
          draft: false
          prerelease: false
          files: publicacao/GeradorOlt-ZTE.exe
